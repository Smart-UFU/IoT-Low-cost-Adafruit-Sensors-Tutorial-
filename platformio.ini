; =============================================================================
; SENSOR TUTORIAL SERIES — PlatformIO Config
; -----------------------------------------------------------------------------
; One environment per (sensor x board) combination. Each environment:
;   1. Defines exactly one -D SENSOR_xxx build flag (read by
;      src/core/SensorManager.h to pick which driver to compile in)
;   2. Restricts build_src_filter to that one sensor's .cpp file, so the
;      other eight sensors' vendor libraries never need to be installed
;   3. Lists only the vendor library that specific sensor needs
;
; Build/upload examples:
;   pio run -e as7341_esp32s3 -t upload
;   pio run -e as7262_uno     -t upload
;
; A NOTE ON LIBRARY NAMES/VERSIONS: every lib_deps entry below (including
; version pins) has been checked against the real library.properties/
; library.json committed in each vendor's own GitHub repo (fetched directly,
; not guessed) — see README.md "What's verified" for the full audit and the
; one real bug it caught (AS7341 was pinned to a version that was never
; published; fixed to the version that actually exists).
; Only AS7341 is version-pinned, because this project's ArduinoJson pin
; (^6.21.5) is NOT optional — it deliberately keeps the resolver on the 6.x
; branch, since core/Protocol.cpp uses the StaticJsonDocument<N> API that
; ArduinoJson v7 removed. Every other library below is left unpinned on
; purpose: PlatformIO always resolves to that library's current latest
; release, which was true by construction at verification time and stays
; true as new releases come out, without risking a stale/never-published
; pin like the AS7341 one above.
;
; See README.md for the full sensor list, wiring, and wire protocol.
; =============================================================================

[platformio]
default_envs = as7341_esp32s3
; Windows tip: if the Library Manager fails with WinError 32 / WinError 183,
; move this project to a short path without accents/spaces/parentheses
; (e.g. C:\pio\sensor_tutorial) or uncomment the line below to keep the
; downloaded libraries outside the project folder:
; libdeps_dir = C:\pio_libdeps

; -----------------------------------------------------------------------------
; Shared board definitions
; -----------------------------------------------------------------------------
[board_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[board_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------------------
; Shared dependency every sensor needs regardless of vendor library
; -----------------------------------------------------------------------------
; NOTE: Adafruit BusIO is intentionally NOT listed here. Every Adafruit sensor
; library below already depends on it and PlatformIO installs it automatically
; at the right version; claws/BH1750 does not use it at all. Listing it twice
; made the Library Manager try to re-unpack it over a folder Windows still had
; locked (WinError 32 / "Could not install package 'adafruit/Adafruit BusIO'").
[common]
common_lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; =============================================================================
; AS7341 — 8 channels, continuous LED (4-258mA), ATIME/ASTEP formula
; (version pin re-verified directly against library.properties on GitHub:
; real latest release is 1.4.1 — this was previously mis-pinned to a
; never-published "^1.4.2" here, which would have hard-failed the build;
; fixed)
; =============================================================================
[env:as7341_esp32s3]
extends = board_esp32s3
build_flags = ${board_esp32s3.build_flags} -D SENSOR_AS7341
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit AS7341 @ ^1.4.1
build_src_filter = +<*> -<sensors/> +<sensors/AS7341.cpp>

[env:as7341_uno]
extends = board_uno
build_flags = -D SENSOR_AS7341
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit AS7341 @ ^1.4.1
build_src_filter = +<*> -<sensors/> +<sensors/AS7341.cpp>

; =============================================================================
; TCS3448 (a.k.a TCS34488) — ams-OSRAM's 2026 "refresh" of the AS7343.
; Adafruit product #6525, released September 2026. Register map + SMUX are
; compatible with AS7343 (per Adafruit's own product page and the
; Adafruit_TCS3448 library README), but the I2C address changed 0x39->0x59
; and the optical filters were retuned by a few nm — so it needs its OWN
; firmware build (not drop-in with AS7343), which is exactly what this
; environment pair is for. The Adafruit_TCS3448 Arduino library subclasses
; Adafruit_AS7343, so both are listed in lib_deps. See README.md "What's
; verified" for the sourcing on all of this — this chip is brand new, so
; nothing about it could come from training data; everything below was
; checked directly against Adafruit's product page, the ams-OSRAM TCS3448
; datasheet (DS001121), and the Adafruit_TCS3448/Adafruit_AS7343 library
; docs, fetched live.
; =============================================================================
[env:tcs3448_esp32s3]
extends = board_esp32s3
build_flags = ${board_esp32s3.build_flags} -D SENSOR_TCS3448
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit TCS3448
    adafruit/Adafruit AS7343
build_src_filter = +<*> -<sensors/> +<sensors/TCS3448.cpp>

[env:tcs3448_uno]
extends = board_uno
build_flags = -D SENSOR_TCS3448
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit TCS3448
    adafruit/Adafruit AS7343
build_src_filter = +<*> -<sensors/> +<sensors/TCS3448.cpp>

; =============================================================================
; AS7343 — 13 channels, continuous LED (4-258mA), ATIME/ASTEP formula
; (14-channel chip; the reference driver exposes 13 named channels)
; =============================================================================
[env:as7343_esp32s3]
extends = board_esp32s3
build_flags = ${board_esp32s3.build_flags} -D SENSOR_AS7343
lib_deps =
