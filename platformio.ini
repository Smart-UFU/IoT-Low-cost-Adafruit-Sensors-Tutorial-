build_src_filter = +<*> -<sensors/> +<sensors/AS7343.cpp>

; =============================================================================
; AS7262 — 6 channels, discrete LED (4 fixed current levels), linear formula
; (name re-verified as "Adafruit AS726X" — capital X — on GitHub; fixed here,
; though PlatformIO's registry match is case-insensitive so the old lowercase
; "AS726x" would likely have resolved fine too)
; =============================================================================
[env:as7262_esp32s3]
extends = board_esp32s3
build_flags = ${board_esp32s3.build_flags} -D SENSOR_AS7262
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit AS726X
build_src_filter = +<*> -<sensors/> +<sensors/AS7262.cpp>

[env:as7262_uno]
extends = board_uno
build_flags = -D SENSOR_AS7262
lib_deps =
    ${common.common_lib_deps}
    adafruit/Adafruit AS726X
build_src_filter = +<*> -<sensors/> +<sensors/AS7262.cpp>

